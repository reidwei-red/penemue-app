<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Penemue</title><link rel="manifest" href="./manifest.json" /><meta name="theme-color" content="#070B14" /><link rel="apple-touch-icon" href="./assets/icons/icon-180.png" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><meta name="apple-mobile-web-app-title" content="Penemue" /><link rel="stylesheet" href="./assets/css/style.css?v=4" /></head>
  <body>
    <div class="app-shell">
      <aside class="sidebar"><p class="brand">PENEMUE<small>守望者工作台</small></p><nav class="nav-list" aria-label="主导航" data-nav></nav></aside>
      <main class="main">
        <section class="view active" data-view="projects"><header class="view-header"><h1>项目看板</h1><p>从仓库的 Markdown 项目卡读取。</p></header><div class="content"><div class="toolbar"><button class="primary" type="button" id="load-projects-button">读取项目卡</button><p class="status" id="projects-status" aria-live="polite">填写 token 后读取项目卡。</p></div><div class="project-grid" id="project-cards"></div></div></section>
        <section class="view" data-view="tasks"><header class="view-header"><h1>待办</h1><p>每次修改只写回仓根的 tasks.md。</p></header><div class="content"><form class="panel toolbar" id="new-task-form"><label class="field grow">待办正文<input name="title" required placeholder="例如：整理本周素材" /></label><label class="field">截止日<input name="dueDate" type="date" /></label><label class="field">分类<input name="category" placeholder="例如：自媒体" /></label><label class="field">优先级<select name="priority"><option value="">无</option><option>高</option><option>中</option><option>低</option></select></label><button class="primary" type="submit">新增待办</button></form><p class="status" id="tasks-status" aria-live="polite">填写 token 后读取 tasks.md。</p><div class="task-list" id="task-list"></div></div></section>
        <section class="view" data-view="inbox"><header class="view-header"><h1>收集箱</h1></header><div class="content panel placeholder">阶段 4 实现</div></section>
        <section class="view" data-view="side"><header class="view-header"><h1>副业</h1></header><div class="content panel placeholder">阶段 4 实现</div></section>
        <section class="view" data-view="topics"><header class="view-header"><h1>选题</h1></header><div class="content panel placeholder">阶段 4 实现</div></section>
        <section class="view" data-view="calendar"><header class="view-header"><h1>日历</h1></header><div class="content panel placeholder">阶段 4 实现</div></section>
        <section class="view" data-view="settings"><header class="view-header"><h1>设置</h1><p>凭据只保存在本机浏览器。</p></header><div class="content panel settings"><label for="token">GitHub 细粒度 PAT<input id="token" type="password" autocomplete="off" placeholder="运行时粘贴 token" /></label><p class="notice">风险提示：token 会保存在这台设备的浏览器 localStorage 中。请勿在公用电脑上填写。</p><p class="notice">应用版本：<span id="app-version"></span></p><div class="toolbar"><button class="primary" id="write-button" type="button">写入测试文件</button><button class="secondary" id="clear-token-button" type="button">清除本机 token</button></div><p class="status" id="result" aria-live="polite">等待操作。</p></div></section>
      </main>
    </div><nav class="bottom-tabs" aria-label="移动导航" data-nav></nav><script type="module" src="./assets/js/app.js?v=4"></script>
  </body>
</html>
