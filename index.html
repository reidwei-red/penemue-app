<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penemue · GitHub 写入测试</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1b1b1b;
        color: #eeeeee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 620px);
        padding: 28px;
        border: 1px solid #444444;
        border-radius: 12px;
        background: #262626;
      }

      h1 { margin-top: 0; font-size: 1.35rem; }
      p { line-height: 1.65; }

      label {
        display: block;
        margin: 20px 0 8px;
        font-weight: 600;
      }

      input, button {
        width: 100%;
        font: inherit;
        border-radius: 7px;
      }

      input {
        padding: 11px;
        border: 1px solid #666666;
        background: #151515;
        color: inherit;
      }

      button {
        margin-top: 18px;
        padding: 11px;
        border: 0;
        background: #d7d7d7;
        color: #181818;
        font-weight: 700;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: 0.65; }
      #clear-token-button { background: #555555; color: #ffffff; }
      .notice { color: #f0c878; font-size: 0.92rem; }

      #result {
        min-height: 5.5em;
        margin: 20px 0 0;
        padding: 14px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        border: 1px solid #4b4b4b;
        border-radius: 7px;
        background: #171717;
      }

      #result[data-kind="success"] { border-color: #4d9a6a; }
      #result[data-kind="error"] { border-color: #bd5b5b; }
      a { color: #8fc6ff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Penemue · GitHub 私有仓写入测试</h1>
      <p>此页面只会尝试写入私有仓 <code>reidwei-red/penemue</code> 的 <code>test.md</code>。</p>

      <label for="token">GitHub 细粒度 PAT</label>
      <input id="token" type="password" autocomplete="off" placeholder="运行时粘贴 token" />
      <p class="notice">风险提示：token 会保存在这台设备的浏览器 localStorage 中。清除浏览器缓存或网站数据后会丢失。请勿在公用电脑上填写。</p>

      <button id="write-button" type="button">写入测试文件</button>
      <button id="clear-token-button" type="button">清除本机 token</button>
      <section id="result" aria-live="polite">等待操作。</section>
    </main>

    <script>
      // 固定本阶段唯一允许访问的 GitHub Contents API 地址。
      const apiUrl = 'https://api.github.com/repos/reidwei-red/penemue/contents/test.md';
      const tokenInput = document.querySelector('#token');
      const writeButton = document.querySelector('#write-button');
      const clearTokenButton = document.querySelector('#clear-token-button');
      const result = document.querySelector('#result');
      let writeCount = 0;

      // 页面打开时从本机浏览器恢复 token；没有保存过时保持空白。
      tokenInput.value = localStorage.getItem('penemue-github-token') || '';

      // 每次输入都立即保存，避免刷新页面后重新粘贴。
      tokenInput.addEventListener('input', () => {
        localStorage.setItem('penemue-github-token', tokenInput.value.trim());
      });

      // 清除本机浏览器保存的 token，方便更换过期的凭据或在公用设备收尾。
      clearTokenButton.addEventListener('click', () => {
        localStorage.removeItem('penemue-github-token');
        tokenInput.value = '';
        showResult('已清除这台设备浏览器保存的 token。');
      });

      // 将任意 Unicode 文本转为 UTF-8 字节后再 Base64，中文不会乱码或抛异常。
      function encodeUtf8Base64(text) {
        const bytes = new TextEncoder().encode(text);
        let binary = '';
        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }
        return btoa(binary);
      }

      // 所有 GitHub 请求共用规定的认证和 API 版本请求头。
      function createHeaders(token) {
        return {
          Authorization: `Bearer ${token}`,
          Accept: 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        };
      }

      // 将状态和详情显示在页面上，避免错误只留在开发者工具里。
      function showResult(message, kind = '') {
        result.textContent = message;
        result.dataset.kind = kind;
      }

      // 把常见 HTTP 状态翻成便于排查的中文提示。
      function explainStatus(status) {
        const explanations = {
          401: 'token 无效或已过期。',
          403: '权限不足或触发限流。',
          404: '仓库名错误，或 token 未被授权访问这个仓库。',
          409: 'sha 冲突：文件已被别处改动，请重试。'
        };
        return explanations[status] || 'GitHub 未完成这次请求，请查看原始 message。';
      }

      // 从失败响应中尽量读取 GitHub 的原始 message，读取失败时也保留说明。
      async function readError(response) {
        let payload = {};
        try {
          payload = await response.json();
        } catch (_) {
          payload = { message: 'GitHub 返回的内容不是 JSON，无法读取详细信息。' };
        }
        return `HTTP ${response.status}：${payload.message || 'GitHub 未提供 message。'}\n${explainStatus(response.status)}`;
      }

      // 先查文件是否存在：存在时带回 sha 更新，不存在时新建且绝不带 sha。
      async function getExistingSha(token) {
        const response = await fetch(apiUrl, { headers: createHeaders(token) });
        if (response.status === 404) return null;
        if (!response.ok) throw new Error(await readError(response));
        const file = await response.json();
        return file.sha;
      }

      writeButton.addEventListener('click', async () => {
        const token = tokenInput.value.trim();
        if (!token) {
          showResult('请先填写 GitHub 细粒度 PAT。', 'error');
          tokenInput.focus();
          return;
        }

        writeButton.disabled = true;
        showResult('正在查询 test.md，并准备写入……');

        try {
          const sha = await getExistingSha(token);
          // ISO 时间含毫秒和 UTC 标识；递增序号保证同次打开页面内每次点击正文都不同。
          const writtenAt = new Date().toISOString();
          const content = `Penemue 阶段 0 写入测试。\n写入时间：${writtenAt}（UTC）。\n写入序号：${++writeCount}。\n这段中文用于验证 UTF-8 Base64 编码没有乱码。\n`;
          const body = {
            message: 'test：验证浏览器直连 Contents API 写入',
            content: encodeUtf8Base64(content),
            branch: 'main'
          };
          if (sha) body.sha = sha;

          const response = await fetch(apiUrl, {
            method: 'PUT',
            headers: createHeaders(token),
            body: JSON.stringify(body)
          });
          if (!response.ok) throw new Error(await readError(response));

          const data = await response.json();
          const commitSha = data?.commit?.sha || 'GitHub 未返回提交 sha。';
          const filePath = data?.content?.path || 'GitHub 未返回文件路径。';
          showResult(`写入成功。\n提交：${commitSha}\n文件：${filePath}`, 'success');

          // 只有 GitHub 返回有效链接时才插入，避免缺字段导致成功页面报错。
          if (data?.content?.html_url) {
            const link = document.createElement('a');
            link.href = data.content.html_url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '在 GitHub 打开 test.md';
            result.append(document.createElement('br'), link);
          }
        } catch (error) {
          showResult(error.message || `发生未知错误：${String(error)}`, 'error');
        } finally {
          writeButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
